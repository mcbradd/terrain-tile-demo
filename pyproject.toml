[tool.uv]
package = false

[tool.uv.sources]
tilepipe-launcher = { path = "tools/launcher/dist/tilepipe_launcher-0.1.0-py3-none-any.whl" }

[project]
name = "tilepipe"
version = "0.1.0"
description = "Terrain tile pipeline demo"
requires-python = "==3.12.*"
dependencies = [
    "rasterio==1.5.2",
    "numpy==2.5.4",
    "mgrs==1.7.0",
    "jinja2==3.1.6",
    "jsonschema==4.26.0",
    "tilepipe-launcher==0.1.0",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
